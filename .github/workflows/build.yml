name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install clang-format
        run: python -m pip install clang-format==21.1.8

      - name: Check sources
        run: python tools/check_source.py

      - name: Managed tests
        run: dotnet run --project scripts/Caligo.Gameplay.Tests/Caligo.Gameplay.Tests.csproj -c ${{ matrix.config }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Headless smoke
        run: build/bin/${{ matrix.config }}/caligo.exe --headless --frames 120

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage/caligo-windows-${{ matrix.config }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/bin/${{ matrix.config }}/caligo.exe" -Destination $stage
          Copy-Item -Recurse "build/bin/${{ matrix.config }}/runtime" -Destination $stage
          Copy-Item -Recurse "content" -Destination $stage
          Copy-Item "LICENSE", "README.md" -Destination $stage
          Get-ChildItem "build/bin/${{ matrix.config }}/*.pdb" -ErrorAction SilentlyContinue | Copy-Item -Destination $stage

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: caligo-windows-${{ matrix.config }}
          path: stage/caligo-windows-${{ matrix.config }}
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.config }}
          path: |
            build/Testing
            build/bin/${{ matrix.config }}/logs
          if-no-files-found: ignore
